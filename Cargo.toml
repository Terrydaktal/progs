[package]
name = "progs"
version = "0.0.5"
edition = "2021"
authors = ["Terrydaktal <9lewis9@gmail.com>"]
description = "Ultra-fast System Programs Manager written in Rust with egui"

[dependencies]
eframe = "0.28"
egui = "0.28"
regex = "1.10"
open = "5.1"
arboard = "3.4"
chrono = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fuzzy-rank = { version = "0.1.0", path = "../fuzzy-rank" }
